name: Relevar contactos institucionales AMBA

# Directorio de vinculación: independiente de la extracción de indicadores (actualizar_amba.yml).
# Solo ejecución manual. No se programa ni se commitea automáticamente.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "prueba = municipios indicados; intermedia = muestra de 8; completo = los 40; candidatos = los de sitio sin comprobar; pendientes = los sin sitio; documentados = sitios de fuente oficial a comprobar por HTTP; discrepancias = solo municipios con discrepancias/faltantes automatizables del insumo preliminar (verifica además los pares de dominio)"
        type: choice
        options: [prueba, intermedia, completo, candidatos, pendientes, documentados, discrepancias]
        default: prueba
      solo_sitios:
        description: "Solo verificar/descubrir sitios oficiales (no relevar contactos). Pensado para modo candidatos o pendientes."
        type: boolean
        default: false
      descubrir_sitios:
        description: "Descubrir/verificar antes el sitio oficial de los municipios sin configurar (solo en esta ejecución; no se commitea config/)"
        type: boolean
        default: true
      municipios:
        description: "Solo modo prueba: ids o nombres separados por coma"
        type: string
        default: "avellaneda,vicente_lopez,tres_de_febrero"
      confirmar_cambios:
        description: "Si es true, commitea 03/05/06/08 a la rama ejecutada (solo si hubo cambios). NUNCA en main: los resultados deben auditarse antes."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: datos-amba          # los dos workflows escriben 05/06/08: se ejecutan de a uno
  cancel-in-progress: false

jobs:
  contactos:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # tope duro del job (antes 120); el descubrimiento tiene además plazos internos
    permissions:
      contents: write   # solo se usa si confirmar_cambios=true
    env:
      MODO: ${{ inputs.modo }}
      MUNICIPIOS: ${{ inputs.municipios }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pruebas unitarias (offline, datos sintéticos)
        run: python -m pytest -q

      - name: Selección de municipios
        run: |
          case "$MODO" in completo) SEL="todos";; intermedia) SEL="intermedia";; candidatos) SEL="candidatos";; pendientes) SEL="pendientes";; documentados) SEL="documentados";; discrepancias) SEL="discrepancias";; *) SEL="$MUNICIPIOS";; esac
          if ! printf '%s' "$SEL" | grep -Eq '^[A-Za-z0-9_ áéíóúÁÉÍÓÚñÑ,.]+$'; then echo "Selección inválida"; exit 1; fi
          echo "SEL=$SEL" >> "$GITHUB_ENV"

      - name: Verificar pares de dominios discrepantes (config vs insumo; no modifica la config)
        if: ${{ inputs.modo == 'discrepancias' }}
        timeout-minutes: 15
        run: python scripts/verificar_pares_dominio.py --salida diagnostico_contactos --plazo-total 600

      - name: Descubrir y verificar sitios oficiales (enlaces de las fichas; sin deducir dominios; no commitea)
        if: ${{ inputs.descubrir_sitios }}
        timeout-minutes: 25
        # tope por solicitud 30 s, por municipio 90 s, total 20 min; al vencer queda el resultado parcial y se sigue
        run: python scripts/descubrir_sitios.py --municipios "$SEL" --aplicar --salida diagnostico_contactos --plazo-total 1200

      - name: Relevar contactos (robots.txt y TLS verificados, pausa de 2 s, solo sitios configurados o verificados)
        if: ${{ !inputs.solo_sitios }}
        timeout-minutes: 60
        run: python scripts/contactos.py --municipios "$SEL" --informe docs/informe_contactos.md --diagnostico diagnostico_contactos | tee contactos.json

      - name: Validar CSV
        if: ${{ !inputs.solo_sitios }}
        run: python scripts/validar.py --modo prueba

      - name: Resumen
        if: always()
        run: |
          [ -f docs/informe_contactos.md ] && cat docs/informe_contactos.md >> "$GITHUB_STEP_SUMMARY"
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import csv, collections
          f = list(csv.DictReader(open("data/actual/06_amba_incidencias.csv", encoding="utf-8-sig"), delimiter=";"))
          c = collections.Counter(r["tipo_incidencia"] for r in f if r["campo"].startswith("contacto:") and r["estado_resolucion"] == "ABIERTA")
          print("\n### Incidencias de contactos abiertas\n" + ("\n".join(f"- `{k}`: {v}" for k, v in c.most_common()) or "- ninguna"))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-amba-contactos
          path: |
            config/sitios_oficiales.csv
            data/
            docs/informe_contactos.md
            contactos.json
            diagnostico_contactos/

      - name: Commit solo si hay cambios reales y NO es main (config/ nunca se commitea desde aquí)
        if: ${{ inputs.confirmar_cambios && github.ref_name != 'main' }}
        run: |
          git config user.name "monitor-amba-bot"
          git config user.email "monitor-amba-bot@users.noreply.github.com"
          git add data docs/informe_contactos.md
          if git diff --cached --quiet; then echo "Sin cambios reales; no se commitea."; exit 0; fi
          git commit -m "datos: directorio de vinculación ($MODO)"
          git push
